name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bookstore_test
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: curl,dom,fileinfo,mbstring,pdo_mysql
        coverage: pcov
    
    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
    
    - name: Install Composer dependencies
      working-directory: backend/bookstore-api
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    
    - name: Copy environment
      working-directory: backend/bookstore-api
      run: cp .env.example .env.testing
    
    - name: Generate APP_KEY
      working-directory: backend/bookstore-api
      run: php artisan key:generate --env=testing
    
    - name: Run migrations
      working-directory: backend/bookstore-api
      run: php artisan migrate --env=testing
    
    - name: Run tests
      working-directory: backend/bookstore-api
      run: php artisan test
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/bookstore-web/package-lock.json'
    
    - name: Install dependencies
      working-directory: frontend/bookstore-web
      run: npm ci
    
    - name: Run linter
      working-directory: frontend/bookstore-web
      run: npm run lint
      continue-on-error: true
    
    - name: Build
      working-directory: frontend/bookstore-web
      run: npm run build

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run PHP linter
      uses: php-actions/composer@v6
      with:
        working-dir: backend/bookstore-api
        command: install
    
    - name: Check code style
      working-directory: backend/bookstore-api
      run: php artisan pint --test
      continue-on-error: true
